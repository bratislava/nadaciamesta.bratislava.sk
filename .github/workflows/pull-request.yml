name: Pull Request
# Every PR against master: env-file guard, then the dockerized checks and a
# no-push production build of both images.
#
# Dependabot PRs wait for a manual approval on the `dependabot` environment
# before anything builds (each build pushes a layer cache to Harbor).
on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependabot-approval:
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: dependabot
    steps:
      - name: Wait for approval
        run: echo "Approved to run CI for Dependabot PR"

  # The infra repo reads <service>/.env.deploy.<cluster> from this repo on every
  # apply and build-image.yml reads next/.env.build.<cluster>; PR CI only builds
  # the development flavour, so guard the rest here.
  env-files:
    if: always() && (needs.dependabot-approval.result == 'success' || needs.dependabot-approval.result == 'skipped')
    needs: [dependabot-approval]
    name: Env Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Every deploy and build env file is committed and non-empty
        run: |
          for c in development staging production; do
            for f in "strapi/.env.deploy.$c" "next/.env.deploy.$c"; do
              git ls-files --error-unmatch "$f"
              test -s "$f" || { echo "::error file=$f::$f is empty"; exit 1; }
            done
            f="next/.env.build.$c"
            git ls-files --error-unmatch "$f"
            grep -q '^STRAPI_URL=https://.' "$f" || { echo "::error file=$f::missing STRAPI_URL"; exit 1; }
          done

  build-strapi:
    name: Strapi
    needs: [env-files]
    # always(): a skipped dependabot-approval would otherwise skip the builds too
    if: always() && needs.env-files.result == 'success'
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    with:
      directory: strapi/
      image: harbor.bratislava.sk/nadaciamesta.bratislava.sk/nadaciamesta-strapi

  build-next:
    name: Next
    needs: [env-files]
    # always(): a skipped dependabot-approval would otherwise skip the builds too
    if: always() && needs.env-files.result == 'success'
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    with:
      directory: next/
      image: harbor.bratislava.sk/nadaciamesta.bratislava.sk/nadaciamesta-next
      env_flavor: true
