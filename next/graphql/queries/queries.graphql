# Strapi 5 GraphQL. Unsorted v3 lists came back in Postgres row order; the v3
# import creates entries in that order, so sorting by id reproduces it.
# Tag relations too: v3 returned them in tag order.

query ContactPage {
  contacts(sort: "id:asc") {
    documentId
    full_name_including_degrees
    role
    email
    phone
    photo {
      url
      formats
    }
  }
  general {
    address
    bank_account_url
    bank_account_iban
  }
}

query GrantsPage {
  general {
    newsletter_text
  }
  grants(sort: "id:asc") {
    documentId
    order
    title
    description
    link
    program {
      name
    }
    files {
      documentId
      url
      name
    }
  }
  tagPrograms(sort: "id:asc") {
    name
  }
}

query GdprPage {
  legal {
    gdpr
  }
}

query DocumentsPage {
  general {
    newsletter_text
  }
  documents(sort: "createdAt:desc") {
    documentId
    title
    createdAt
    archived
    file {
      url
      ext
      size
    }
  }
}

query AboutUsPage {
  aboutUs {
    sections {
      id
      title
      detail
      files {
        documentId
        name
        ext
        size
        url
        createdAt
      }
    }
  }
}

query LandingPage {
  landingPage {
    grants_text
    # grants_button_text
    featured_projects_top {
      documentId
      images {
        alternativeText
        url
        formats
      }
    }
    featured_projects_bottom {
      documentId
      images {
        alternativeText
        url
        formats
      }
    }
  }
}

query HeaderAndFooter {
  general {
    copyright_text
    phone
    email
    facebook_link
    instagram_link
  }
}

query Project($documentId: ID!) {
  project(documentId: $documentId) {
    documentId
    title
    description
    categories(sort: "id:asc") {
      documentId
      name
    }
    year {
      documentId
      name
    }
    districts(sort: "id:asc") {
      documentId
      name
    }
    legal_form {
      documentId
      name
    }
    program {
      documentId
      name
    }
    support_fields(sort: "id:asc") {
      documentId
      name
    }
    goals(sort: "id:asc") {
      documentId
      name
    }
    images {
      documentId
      alternativeText
      url
      formats
    }
  }
  legal {
    project_detail_disclaimer
  }
}

query Projects($filters: ProjectFiltersInput, $limit: Int, $offset: Int) {
  projects(filters: $filters, pagination: { limit: $limit, start: $offset }, sort: "id:asc") {
    documentId
    title
    description
    images {
      url
      alternativeText
      formats
    }
    categories(sort: "id:asc") {
      name
    }
    year {
      name
    }
    districts(sort: "id:asc") {
      name
    }
    legal_form {
      name
    }
    program {
      name
    }
    support_fields(sort: "id:asc") {
      name
    }
    goals(sort: "id:asc") {
      name
    }
  }
  projects_connection(filters: $filters) {
    pageInfo {
      total
    }
  }
}

query ProjectsPage {
  tagCategories(sort: "id:asc") {
    name
  }
  tagDistricts(sort: "id:asc") {
    name
  }
  tagGoals(sort: "id:asc") {
    name
  }
  tagLegalForms(sort: "id:asc") {
    name
  }
  tagPrograms(sort: "id:asc") {
    name
  }
  tagSupportFields(sort: "id:asc") {
    name
  }
  tagYears(sort: "id:asc") {
    name
  }
}

query BlogPostsPage {
  blogPosts(sort: "createdAt:desc") {
    documentId
    title
    description
    slug
    image {
      url
      alternativeText
      formats
    }
  }
}

query BlogPostsBySlug($slug: String!) {
  blogPosts(filters: { slug: { eq: $slug } }) {
    documentId
    title
    description
    content
    slug
    author
    createdAt
    image {
      url
      alternativeText
      formats
    }
  }
}
